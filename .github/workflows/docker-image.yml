name: Build and publish ComfyUI worker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: peeenguin/velvet-comfyui-worker
  IMAGE_TAG: model-artifacts-v1-${{ github.sha }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run worker unit tests on GitHub runner
        shell: bash
        run: python3 -m unittest discover -s . -p 'test_*.py' -v

      - name: Free runner disk space for CUDA base image
        shell: bash
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          docker system prune --all --force --volumes
          df -h /

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build worker image for acceptance (not published yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            WORKER_BUILD_SHA=${{ github.sha }}

      - name: Inspect image startup contract
        shell: bash
        run: |
          config="$(docker image inspect "${IMAGE_NAME}:${IMAGE_TAG}" --format '{{json .Config}}')"
          echo "$config"
          echo "$config" | jq -e '.Entrypoint == ["/bin/bash", "/start.sh"]'
          echo "$config" | jq -e '(.Cmd == null) or (.Cmd == [])'

      - name: Run worker startup self-test
        shell: bash
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -e WORKER_STARTUP_SELF_TEST=1 \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            /start.sh

      - name: Run shell and Python smoke checks
        shell: bash
        run: |
          docker run --rm --entrypoint /bin/bash "${IMAGE_NAME}:${IMAGE_TAG}" -n /start.sh
          docker run --rm --entrypoint python3 "${IMAGE_NAME}:${IMAGE_TAG}" -c \
            "import sys; sys.path.insert(0, '/'); import boto3, handler, model_artifacts, requests, runpod, websocket"

      - name: Publish immutable worker image
        shell: bash
        run: |
          image="${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "$image"
          digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}' | sed 's/.*@//')"
          test -n "$digest"
          {
            echo "## Worker image acceptance"
            echo "- worker_build=${GITHUB_SHA}"
            echo "- image=${image}"
            echo "- digest=${digest}"
            echo "- startup_self_test=passed"
          } >> "$GITHUB_STEP_SUMMARY"
