name: Build and publish ComfyUI worker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: comfy-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: peeenguin/velvet-comfyui-worker
  IMAGE_TAG: model-artifacts-v1-${{ github.sha }}
  CACHE_REF: peeenguin/velvet-comfyui-worker:buildcache

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run worker unit tests on GitHub runner
        shell: bash
        run: python3 -m unittest discover -s . -p 'test_*.py' -v

      - name: Validate startup files
        shell: bash
        run: |
          test "$(file -b --mime-encoding start.sh)" = "us-ascii"
          test "$(head -c 2 start.sh | od -An -t x1 | tr -d ' ')" != "efbb"
          bash -n start.sh
          grep -Fq 'COPY model_artifacts.py /model_artifacts.py' Dockerfile
          grep -Fq 'import model_artifacts' Dockerfile

  build-and-publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable worker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          load: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            WORKER_BUILD_SHA=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: type=registry,ref=${{ env.CACHE_REF }},mode=max
          provenance: mode=max
          sbom: true

      - name: Verify remote image contract without pulling the image
        env:
          PUBLISHED_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          image="${IMAGE_NAME}:${IMAGE_TAG}"
          docker buildx imagetools inspect "$image" --format '{{json .}}' > /tmp/worker-image-inspect.json
          PUBLISHED_DIGEST="$PUBLISHED_DIGEST" IMAGE="$image" EXPECTED_SHA="$GITHUB_SHA" \
            python3 - <<'PY'
          import json
          import os

          with open('/tmp/worker-image-inspect.json', encoding='utf-8') as stream:
              inspected = json.load(stream)

          # `--format '{{json .}}'` serializes the Buildx context with
          # lower-case top-level fields (`image`, `manifest`), while older
          # Buildx versions exposed the Go field names. Accept both shapes so
          # the remote contract check verifies the published image instead of
          # rejecting a valid manifest because of serializer casing.
          image = inspected.get('image') or inspected.get('Image')
          if isinstance(image, dict) and 'config' not in image:
              image = image.get('linux/amd64')
          if not isinstance(image, dict) or not isinstance(image.get('config'), dict):
              raise SystemExit('remote inspection did not return linux/amd64 image config')

          config = image['config']
          if config.get('Entrypoint') != ['/bin/bash', '/start.sh']:
              raise SystemExit(f"unexpected entrypoint: {config.get('Entrypoint')!r}")
          if config.get('Cmd') not in (None, []):
              raise SystemExit(f"unexpected cmd: {config.get('Cmd')!r}")
          if image.get('architecture') != 'amd64' or image.get('os') != 'linux':
              raise SystemExit('remote config is not linux/amd64')
          revision = (config.get('Labels') or {}).get('org.opencontainers.image.revision')
          if revision != os.environ['EXPECTED_SHA']:
              raise SystemExit(f"revision label mismatch: {revision!r}")

          print(f"verified_image={os.environ['IMAGE']}")
          print(f"verified_digest={os.environ.get('PUBLISHED_DIGEST', '')}")
          print(f"verified_revision={revision}")
          print('verified_entrypoint=/bin/bash /start.sh')
          print('verified_cmd=[]')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Worker image acceptance\n')
              summary.write(f"- image={os.environ['IMAGE']}\n")
              summary.write(f"- digest={os.environ.get('PUBLISHED_DIGEST', '')}\n")
              summary.write(f"- worker_build={revision}\n")
              summary.write('- remote_contract=passed\n')
          PY
